<div class="muro-container">
  
  <div class="form-publicacion">
    <h3>Nueva Publicación</h3>
    <div class="form-group">
      <input type="text" [(ngModel)]="nuevoTitulo" placeholder="Título de la publicación">
    </div>
    <div class="form-group">
      <textarea [(ngModel)]="nuevaDescripcion" placeholder="¿Qué estás pensando?"></textarea>
    </div>
    
    <div class="form-group">
      <label for="foto-input" style="display: block; margin-bottom: 5px; font-weight: bold;">Subir Imagen (opcional):</label>
      <input 
        id="foto-input" 
        type="file" 
        accept="image/*" 
        (change)="onFileSelected($event)"
      >
    </div>
    <button class="btn-publicar" (click)="crearPost()">Publicar Posteo</button>
  </div>

  <hr class="divisor">

  <div class="filtros-bar">
    <button class="btn-filtro" (click)="cambiarOrden('fecha')" [class.active]="orden === 'fecha'">Más Recientes</button>
    <button class="btn-filtro" (click)="cambiarOrden('likes')" [class.active]="orden === 'likes'">Populares (Likes)</button>
  </div>

  <div class="listado-posts">
    <div *ngFor="let pub of publicaciones" class="card-publicacion">
      <div class="pub-header">
        <div class="user-info">
          <h4>{{ pub.usuario?.firstName }} {{ pub.usuario?.lastName }}</h4>
          <small>{{ pub.createdAt | date:'short' }}</small>
        </div>
        <button *ngIf="esDuenio(pub.usuarioId)" class="btn-eliminar" (click)="eliminar(pub._id)">Eliminar</button>
      </div>
      
      <div class="pub-body">
        <h3>{{ pub.titulo }}</h3>
        <p>{{ pub.descripcion }}</p>
        
        <img *ngIf="pub.imagenUrl" [src]="'http://localhost:3000' + pub.imagenUrl" class="pub-img">
      </div>

      <div class="pub-footer">
          <button class="btn-like" (click)="manejarLike(pub)">
            ❤️ {{ pub.likes?.length || 0 }} Likes
          </button>

          <div *ngIf="pub.comentarios && pub.comentarios.length > 0" class="seccion-comentarios" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; text-align: left;">
            <h5 style="margin-bottom: 8px; color: #555;">💬 Comentarios:</h5>
            <div *ngFor="let com of pub.comentarios" style="background: #f9f9f9; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px;">
              <strong style="color: #0056b3;">{{ com.autor }}:</strong> <span>{{ com.texto }}</span>
            </div>
          </div>
        </div>  
      </div>

  <div *ngIf="publicaciones.length === 0" class="no-posts">
    <p>No hay publicaciones activas en el muro. ¡Crea una arriba para testear!</p>
  </div>

  <button *ngIf="publicaciones.length > 0" (click)="cargarMas()" class="btn-cargar-mas">Cargar más</button>
</div>
